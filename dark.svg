<!-- Animated Terminal Information Panel -->

<g transform="translate(540,100)">

  <!-- Panel -->
  <rect width="560" height="430"
        rx="14"
        fill="#0D1424"
        stroke="#22D3EE"
        stroke-width="1"/>


  <!-- Header -->
  <text x="30" y="45"
        fill="#22D3EE"
        font-size="18"
        font-family="monospace">
        SYSTEM.INFO
  </text>


  <line x1="30" y1="65"
        x2="520"
        y2="65"
        stroke="#334155"/>


  <!-- Name -->
  <text x="30" y="110"
        fill="#94A3B8"
        font-size="15"
        font-family="monospace">
        NAME:
  </text>

  <text x="180" y="110"
        fill="#F8FAFC"
        font-size="15"
        font-family="monospace">

        SAI KRISHNA

  </text>


  <!-- Role -->
  <text x="30" y="155"
        fill="#94A3B8"
        font-size="15"
        font-family="monospace">

        ROLE:

  </text>


  <text x="180" y="155"
        fill="#10B981"
        font-size="15"
        font-family="monospace">

        FULL STACK DEV

  </text>


  <!-- Animated typing -->

  <text x="30"
        y="220"
        fill="#22D3EE"
        font-size="17"
        font-family="monospace">

        &gt; status_

        <animate
        attributeName="opacity"
        values="1;0;1"
        dur="1s"
        repeatCount="indefinite"/>

  </text>


  <text x="30"
        y="260"
        fill="#A78BFA"
        font-size="16"
        font-family="monospace">

        Building AI Projects...

        <animate
        attributeName="x"
        values="30;40;30"
        dur="3s"
        repeatCount="indefinite"/>

  </text>



  <!-- Skills -->

  <text x="30"
        y="330"
        fill="#94A3B8"
        font-size="15"
        font-family="monospace">

        STACK:

  </text>


  <text x="180"
        y="330"
        fill="#F8FAFC"
        font-size="15"
        font-family="monospace">

        JAVA | REACT | AI

  </text>



  <!-- Live animation -->

  <circle cx="45"
          cy="390"
          r="8"
          fill="#10B981">

      <animate
      attributeName="r"
      values="8;12;8"
      dur="1.5s"
      repeatCount="indefinite"/>

  </circle>


  <text x="70"
        y="397"
        fill="#10B981"
        font-size="16"
        font-family="monospace">

        ONLINE

  </text>


</g>
